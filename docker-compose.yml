services:
  pokedex-backend:
    build: ./Backend
    container_name: pokedex-backend
    restart: unless-stopped
    # 127.0.0.1 seulement : en production, Caddy joint le backend par le
    # réseau Docker "proxy". Le port n'est jamais ouvert sur internet, mais
    # il reste accessible en local pour le développement.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: ${MONGO_URI}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - pokedex-db
    networks:
      - proxy
      - pokedex_internal

  # Construit le frontend (Vite) dans ./dist, que Caddy sert en statique.
  # Conteneur "one-shot" : il est relancé à chaque `docker compose up -d`
  # (donc à chaque déploiement automatique) et s'arrête une fois le build
  # fini. Le build se fait à part puis remplace ./dist d'un coup : le site
  # n'est jamais servi à moitié vide. VITE_API_URL vient de
  # Frontend/.env.production.
  pokedex-frontend-build:
    image: node:22-alpine
    container_name: pokedex-frontend-build
    restart: "no"
    working_dir: /app
    command: >
      sh -c "npm ci --no-audit --no-fund
      && npm run build -- --outDir /tmp/dist --emptyOutDir
      && rm -rf /out/* && cp -r /tmp/dist/. /out/"
    volumes:
      - ./Frontend:/app
      # node_modules dans un volume : rien n'est écrit dans le dépôt
      - pokedex_frontend_modules:/app/node_modules
      - ./dist:/out

  pokedex-db:
    image: mongo:7
    container_name: pokedex-db
    restart: unless-stopped
    volumes:
      - pokedex_db_data:/data/db
    networks:
      - pokedex_internal

networks:
  proxy:
    external: true
  pokedex_internal:

volumes:
  pokedex_db_data:
  pokedex_frontend_modules:
